name: Production macOS bundle

on:
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "rust/asr_bridge/**"
      - "Assets/**"
      - "Info.plist"
      - "Package.swift"
      - "Package.resolved"
      - "build.sh"
      - "script/build_and_run.sh"
      - "script/atomic_replace_bundle.swift"
      - "script/verify_bundle.sh"
      - ".github/workflows/production-macos.yml"
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "rust/asr_bridge/**"
      - "Assets/**"
      - "Info.plist"
      - "Package.swift"
      - "Package.resolved"
      - "build.sh"
      - "script/build_and_run.sh"
      - "script/atomic_replace_bundle.swift"
      - "script/verify_bundle.sh"
      - ".github/workflows/production-macos.yml"

permissions:
  contents: read

jobs:
  full-bundle:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/asr_bridge
      - name: Swift tests
        run: swift test
      - name: Native bridge tests
        run: cargo test --locked --manifest-path rust/asr_bridge/Cargo.toml
      - name: Native bridge clippy
        run: cargo clippy --locked --manifest-path rust/asr_bridge/Cargo.toml --all-targets -- -D warnings
      - name: Build complete application bundle
        run: ./build.sh
      - name: Verify complete application bundle
        run: ./script/verify_bundle.sh ./build/Speakeasy.app
      - name: Privacy persistence canary
        run: swift test --filter DiagnosticsStoreTests/testPersistenceIsBoundedAndContainsNoDictatedContent
