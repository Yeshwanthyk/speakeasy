[package]
name = "speech-bench"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "speech-bench"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode_categories = "0.1"
unicode-normalization = "0.1"
wait-timeout = "0.2"
transcribe-cpp = { version = "=0.1.3", default-features = false, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
